services:
  # Render = FRONTEND ONLY (https://now-casr.onrender.com)
  # Backend is completely removed from Render and hosted on Vercel
  - type: web
    name: now-casr
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://co-nowcasr.vercel.app
      - key: VITE_MAPTILER_API_KEY
        value: ehLkmAaIGPEMafg5WhXy
